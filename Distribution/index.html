<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #1a1a1a;
        line-height: 1.5;
    }

    .button {
        display: flex;
        flex-direction: row; /* Aligne les éléments côte à côte */
        gap: 15px;           /* Espace constant entre chaque bouton */
        align-items: center;
        margin-top: 20px;
    }

    /* Style individuel des boutons */
    .button .button {
        background-color: white;
        border: 0;
        padding: 20px 40px;
        box-shadow: 0px 10px 20px 0px rgba(0, 0, 0, 0.3);
        font-size: 20px;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        margin-left: 10px;
        margin-top: 10px;
    }

    .button .button:hover {
        transform: translateY(-4px);
        box-shadow: 0px 15px 25px 0px rgba(0, 0, 0, 0.2);
        background-color: #f8f9fa;
    }

    .button .logo {
    /* Dimensions explicites pour l'image */
        width: 100px;
        height: 100px;
    
    /* Supprime TOUTES les bordures et contours par défaut */
        border: none;
        outline: none;
        background-color: transparent;
    
        /* Retrait du padding qui déformait le bloc */
        padding: 0;
        margin-left: 10px;
        margin-top: 10px;

    /* Gestion propre du fond */
        background-image: url('/Distribution/Image/whats-gnu-2062451264.jpg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

    .button a {
        text-decoration: none;
        outline: none;
        border: none;
    }

    /* Le conteneur aligne les boutons côte à côte */
    .linux-button {
        display: flex;        /* Affiche les enfants côte à côte */
        flex-wrap: wrap;      /* Permet de passer à la ligne sur petit écran */
        gap: 20px;            /* Crée l'espace entre les boutons */
    }

    /* Style appliqué à tous les boutons dans la div */
    .linux-button button {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      
        padding: 40px;
        cursor: pointer;
        border: 0px;
        box-shadow: 0px 10px 20px 0px rgba(0, 0, 0, 0.3);
        font-size: 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .linux-button button .icone {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }

    .linux-button button:hover {
        transform: translateY(-4px);
        box-shadow: 0px 15px 25px 0px rgba(0, 0, 0, 0.2);
        background-color: #f8f9fa;
    }

    .Catégorie {
        background-color: white;
        padding: 5px 20px;
        box-shadow: 0px 10px 20px 0px rgba(0, 0, 0, 0.3);
    }

    </style>
</head>

    <div class="button">
        <a href='/index.html'>
        <button class="logo"></button>
        </a>
        <a href='/index.html'>
        <button class="button">Home</button>
        </a>
        <a href='/Wiki/index.html'>
        <button class="button">Wiki</button>
        </a>
        <a href='/Distribution/'>
        <button class="button">Distribution</button>
        </a>
        <button class="button">Contact</button>
    </div>

    <div class="linux-button">
        <button>
            <img src="/Distribution/Image/Fedora_icon_(2021).svg.webp" alt="Icône Fedora" class="icone">
            <span>Fedora</span>
        </button>
        <button>
            <img src="/Distribution/Image/Pop!_OS_Icon.svg.webp" alt="Icône Ubuntu" class="icone">
            <span>Pop! OS</span>
        </button>
        <button>
            <img src="/Distribution/Image/Linux_Mint_logo_without_wordmark.svg.webp" alt="Icône Ubuntu" class="icone">
            <span>Linux Mint</span>
        </button>
        <button>
            <img src="/Distribution/Image/Zorin_OS.svg.webp" alt="Icône Ubuntu" class="icone">
            <span>Zorin OS</span>
        </button>
        <button>
            <img src="/Distribution/Image/UbuntuCoF.svg.webp" alt="Icône Ubuntu" class="icone">
            <span>Ubuntu</span>
        </button>
        <button>
            <img src="/Distribution/Image/Linux_Mint_logo_without_wordmark.svg.webp" alt="Icône Ubuntu" class="icone">
            <span>Linux Mint</span>
        </button>
    </div>
    
    <h1 class="Catégorie">Gaming :</h1>

    <div class="linux-button">
        <button>

        </button>
        <button>

    <div class="linux-button">
        <button>
            <img src="/Distribution/Image/debian.png" alt="Icône Fedora" class="icone">
            <span>Debian</span>
        </button>
        
    </div>

</body>
</html>
